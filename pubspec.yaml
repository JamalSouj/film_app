name: film_app
description: "A cinematic movie & TV show streaming application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # ---------- State Management ----------
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ---------- Routing ----------
  go_router: ^14.8.1

  # ---------- Networking ----------
  dio: ^5.8.0+1

  # ---------- Data Models (immutable, union‑types, JSON) ----------
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ---------- Local Storage ----------
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # ---------- Web View (streaming embeds) ----------
  flutter_inappwebview: ^6.1.5

  # ---------- Environment Variables ----------
  flutter_dotenv: ^5.2.1

  # ---------- UI Helpers ----------
  cached_network_image: ^3.4.1      # Poster & backdrop caching
  shimmer: ^3.0.0                    # Skeleton loading placeholders
  google_fonts: ^6.2.1              # Premium typography (Inter, etc.)

  # ---------- Utilities ----------
  equatable: ^2.0.7
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ---------- Code Generation ----------
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - .env
